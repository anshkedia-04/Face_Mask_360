name: Reboot Streamlit App

# Trigger workflow every 3 hours
on:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours UTC
  workflow_dispatch:         # allows manual trigger

jobs:
  reboot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Touch a dummy file to trigger redeploy
        run: |
          # Create or update a dummy file
          echo "Redeploy triggered at $(date)" >> .reboot_trigger.txt
          
          # Configure git
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          # Commit and push changes
          git add .reboot_trigger.txt
          git commit -m "Auto-redeploy Streamlit app: $(date)" || echo "No changes to commit"
          git push
